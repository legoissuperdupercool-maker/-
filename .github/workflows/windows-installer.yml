name: Build ForgeInstaller.exe

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeInstaller
          path: dist/ForgeInstaller.exe
          if-no-files-found: error

      # A fixed "windows-latest" release gives a stable download link to the newest build.
      - name: Publish download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest dist/ForgeInstaller.exe \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Forge for Windows (latest build)" \
            --notes "Download **ForgeInstaller.exe**, run it, and Forge appears on your desktop and in the Start menu. Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Windows may show a SmartScreen warning because the installer is not code-signed: click *More info* → *Run anyway*."
