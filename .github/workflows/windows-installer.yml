name: Build ForgeInstaller.exe

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # Every build gets a higher version, so installed copies can tell an update exists.
      FORGE_VERSION: 0.2.${{ github.run_number }}
      # Step `if:` conditions can only see job-level env, so the secret is exposed here.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write release notes
        shell: bash
        run: git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > build/release-notes.md

      - name: Build installer
        shell: bash # PowerShell splits "-c.extraMetadata.version=…" at the dot
        run: npx electron-builder --win nsis --x64 --publish never "--config.extraMetadata.version=${FORGE_VERSION}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check update files
        shell: bash
        run: |
          ls -la dist
          test -f dist/ForgeInstaller.exe
          test -f dist/latest.yml
          grep -q "version: ${FORGE_VERSION}" dist/latest.yml
          cat dist/latest.yml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeInstaller-${{ env.FORGE_VERSION }}
          path: |
            dist/ForgeInstaller.exe
            dist/latest.yml
          if-no-files-found: error

      # Installers go to the PUBLIC repo legoissuperdupercool-maker/forge-releases (this code repo
      # is private), one release per version. Installed apps read
      # forge-releases/releases/latest/download/latest.yml to find updates.
      # Needs the RELEASES_TOKEN secret: a fine-grained token with Contents read/write on forge-releases.
      - name: Publish to forge-releases
        if: ${{ env.RELEASES_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: legoissuperdupercool-maker/forge-releases
        run: |
          cat > notes.md <<NOTES
          **Forge ${FORGE_VERSION} for Windows**

          Download **ForgeInstaller.exe** below and run it. Forge appears on your desktop and in the Start menu. Installed copies update themselves: look for the glowing *Update available* badge.

          Windows may show a SmartScreen warning because the installer is not code-signed. Click *More info* → *Run anyway*.

          ### What's new
          $(cat build/release-notes.md)
          NOTES
          FILES="dist/ForgeInstaller.exe dist/latest.yml"
          if [ -f dist/ForgeInstaller.exe.blockmap ]; then FILES="$FILES dist/ForgeInstaller.exe.blockmap"; fi
          # Create as a draft, upload everything, then publish, so "latest" never points at a half-uploaded release.
          gh release create "v${FORGE_VERSION}" $FILES --repo "$PUBLIC_REPO" --draft --title "Forge ${FORGE_VERSION}" --notes-file notes.md
          gh release edit "v${FORGE_VERSION}" --repo "$PUBLIC_REPO" --draft=false --latest

      - name: Missing RELEASES_TOKEN
        if: ${{ env.RELEASES_TOKEN == '' }}
        shell: bash
        run: echo "::warning::RELEASES_TOKEN secret is not set, so this build was not published to forge-releases. The installer is attached to this run as an artifact."
