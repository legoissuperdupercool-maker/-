# XcodeGen spec for ello smartTV on iPad / iPhone (and later Apple TV).
# CI generates the Xcode project from this file: `xcodegen generate`.
name: Ello
options:
  bundleIdPrefix: com.ello
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ello:
    type: application
    platform: iOS
    sources:
      - Ello
    dependencies:
      # Downloaded by CI (see .github/workflows/apple-app.yml).
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ello.smarttv
        PRODUCT_NAME: ello smartTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ello smartTV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Ello/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: Pick a photo for your profile picture or background.
        NSLocalNetworkUsageDescription: Play streams from IPTV servers on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio]

  # Apple TV: the same app and sources, with the Siri Remote and TVVLCKit.
  ElloTV:
    type: application
    platform: tvOS
    sources:
      - path: Ello
        excludes:
          - "Info.plist"
      # The Apple TV icon (layered) and Top Shelf banners.
      - path: ElloTV
        excludes:
          - "Info.plist"
    dependencies:
      # Downloaded by CI (see .github/workflows/apple-app.yml).
      - framework: Frameworks/TVVLCKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ello.smarttv.tv
        PRODUCT_NAME: ello smartTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ello smartTV
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: ElloTV/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Play streams from IPTV servers on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
